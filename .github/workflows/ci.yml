name: CI + Deploy

# Quality gate on every push/PR; production deploy to Cloudflare Pages on main.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN    — Cloudflare API token w/ Account › Cloudflare Pages
#                             › Edit (+ Account › Account Settings › Read)
#   CLOUDFLARE_ACCOUNT_ID   — Cloudflare account id (see `wrangler whoami`)
#   VITE_SUPABASE_URL       — from .env.local (Supabase project URL)
#   VITE_SUPABASE_ANON_KEY  — from .env.local (public anon key — safe for CI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# VITE_* vars are inlined at build time; both jobs inherit them so any build
# produced in this pipeline is a faithful, deployable bundle.
env:
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  test-and-build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check + build (tsc && vite build)
        run: npm run build

      - name: Unit tests (vitest)
        run: npm test

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install + build
        run: |
          npm ci
          npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: student-academic-os
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
