<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Analytics v2 — SGPA Solver — Student Academic OS</title>
  <style>
    :root { --bg:#000; --card:rgba(28,28,30,0.9); --border:rgba(255,255,255,0.1); --text:#fff; --muted:#8e8e93; --accent:#0a84ff; --green:#30d158; --amber:#ff9f0a; --red:#ff453a; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,'SF Pro Display',sans-serif; }
    body { background:var(--bg); color:var(--text); padding-bottom:100px; }
    .status-bar { height:47px; padding:0 24px; display:flex; justify-content:space-between; align-items:center; font-weight:600; }
    .large-title { padding:0 20px 16px; font-size:34px; font-weight:800; letter-spacing:-0.5px; }

    /* SGPA Solver */
    .solver-card { margin:0 20px 16px; background:var(--card); backdrop-filter:blur(20px); border:1px solid var(--border); border-radius:22px; padding:20px; }
    .sc-head { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; color:var(--muted); margin-bottom:14px; }
    .sc-target { font-size:48px; font-weight:800; color:var(--accent); text-align:center; margin:10px 0; }
    .sc-label { text-align:center; font-size:14px; color:var(--muted); margin-bottom:16px; }
    .slider-row { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
    .slider-label { font-size:13px; color:var(--muted); min-width:60px; }
    input[type=range] { -webkit-appearance:none; flex:1; height:4px; border-radius:2px; background:rgba(255,255,255,0.15); outline:none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--accent); cursor:pointer; }
    .slider-val { font-size:14px; font-weight:700; color:var(--accent); min-width:36px; text-align:right; }
    .result-row { background:rgba(48,209,88,0.08); border:1px solid rgba(48,209,88,0.25); border-radius:14px; padding:12px 16px; margin-top:12px; display:flex; justify-content:space-between; align-items:center; }
    .rr-label { font-size:14px; color:var(--green); }
    .rr-val { font-size:18px; font-weight:800; color:var(--green); }

    /* Progress rings (SVG) */
    .rings-row { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:0 20px 16px; }
    .ring-card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:14px; display:flex; flex-direction:column; align-items:center; }
    .ring-label { font-size:11px; color:var(--muted); margin-top:8px; text-align:center; }
    .ring-val { font-size:16px; font-weight:800; margin-top:2px; }

    .tab-bar { position:fixed; bottom:0; left:0; right:0; height:84px; background:rgba(0,0,0,0.85); backdrop-filter:blur(24px); border-top:1px solid rgba(255,255,255,0.08); display:flex; padding-bottom:20px; }
    .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; text-decoration:none; color:var(--muted); font-size:10px; font-weight:500; }
    .tab.active { color:var(--accent); }
    .tab svg { width:24px; height:24px; fill:currentColor; }
  </style>
</head>
<body>
  <div class="status-bar"><span>9:41</span><span>100%</span></div>
  <div style="padding:8px 20px 0; font-size:13px; font-weight:600; color:var(--muted);">SEM 3 TRACKER</div>
  <div class="large-title">Analytics</div>

  <div class="solver-card">
    <div class="sc-head">🎯 SGPA Target Solver</div>
    <div class="sc-target">9.0</div>
    <div class="sc-label">Your goal for this semester</div>
    <div class="slider-row">
      <span class="slider-label">Target SGPA</span>
      <input type="range" min="6" max="10" step="0.1" value="9.0" oninput="this.nextElementSibling.textContent=this.value">
      <span class="slider-val">9.0</span>
    </div>
    <div class="slider-row">
      <span class="slider-label">Credits Done</span>
      <input type="range" min="0" max="25" step="1" value="12" oninput="this.nextElementSibling.textContent=this.value">
      <span class="slider-val">12</span>
    </div>
    <div class="result-row">
      <span class="rr-label">Required in remaining exams</span>
      <span class="rr-val">87.5%</span>
    </div>
  </div>

  <div class="rings-row">
    <div class="ring-card">
      <svg width="60" height="60" viewBox="0 0 60 60">
        <circle cx="30" cy="30" r="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
        <circle cx="30" cy="30" r="24" fill="none" stroke="#30d158" stroke-width="6" stroke-dasharray="131" stroke-dashoffset="20" stroke-linecap="round" transform="rotate(-90 30 30)"/>
      </svg>
      <div class="ring-label">Att. Overall</div>
      <div class="ring-val" style="color:#30d158;">82.1%</div>
    </div>
    <div class="ring-card">
      <svg width="60" height="60" viewBox="0 0 60 60">
        <circle cx="30" cy="30" r="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
        <circle cx="30" cy="30" r="24" fill="none" stroke="#0a84ff" stroke-width="6" stroke-dasharray="131" stroke-dashoffset="30" stroke-linecap="round" transform="rotate(-90 30 30)"/>
      </svg>
      <div class="ring-label">Task Rate</div>
      <div class="ring-val" style="color:#0a84ff;">77%</div>
    </div>
    <div class="ring-card">
      <svg width="60" height="60" viewBox="0 0 60 60">
        <circle cx="30" cy="30" r="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="6"/>
        <circle cx="30" cy="30" r="24" fill="none" stroke="#ff9f0a" stroke-width="6" stroke-dasharray="131" stroke-dashoffset="52" stroke-linecap="round" transform="rotate(-90 30 30)"/>
      </svg>
      <div class="ring-label">CGPA</div>
      <div class="ring-val" style="color:#ff9f0a;">8.4</div>
    </div>
  </div>

  <nav class="tab-bar">
    <a href="../Dashboard/dashboard-v2.html" class="tab"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</a>
    <a href="../Timetable/timetable-v2.html" class="tab"><svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>Schedule</a>
    <a href="#" class="tab active"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>Analytics</a>
    <a href="../Notes/notes-v2.html" class="tab"><svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>Notes</a>
    <a href="../Settings/settings-v2.html" class="tab"><svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>More</a>
  </nav>
</body>
</html>
