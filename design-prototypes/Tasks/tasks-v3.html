<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tasks v3 — Matrix Priority View — Student Academic OS</title>
  <style>
    :root { --bg:#090d16; --card:#111827; --border:rgba(255,255,255,0.08); --text:#f9fafb; --muted:#6b7280; --accent:#6366f1; --green:#10b981; --amber:#f59e0b; --red:#ef4444; --mono:'JetBrains Mono',monospace; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,sans-serif; }
    body { background:var(--bg); color:var(--text); padding-bottom:90px; }
    .status-bar { height:47px; padding:0 24px; display:flex; justify-content:space-between; align-items:center; font-size:14px; }
    header { padding:12px 20px; border-bottom:1px solid var(--border); }

    /* Matrix */
    .matrix { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:14px 20px; }
    .quad { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:12px; min-height:150px; }
    .quad-head { font-size:11px; font-family:var(--mono); font-weight:700; margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:6px; }
    .q-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .task-row { font-size:13px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.04); display:flex; align-items:center; gap:8px; }
    .task-row:last-child { border-bottom:none; }
    .mini-check { width:14px; height:14px; border-radius:50%; border:1.5px solid var(--muted); flex-shrink:0; }

    /* Quick add */
    .quick-add { margin:0 20px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; display:flex; align-items:center; gap:12px; }
    .qa-input { flex:1; background:none; border:none; outline:none; font-size:15px; color:var(--text); font-family:-apple-system,sans-serif; }
    .qa-input::placeholder { color:var(--muted); }
    .qa-btn { background:var(--accent); border:none; border-radius:10px; width:32px; height:32px; display:grid; place-items:center; cursor:pointer; }
    .qa-btn svg { width:18px; height:18px; fill:#fff; }

    .nav-bar { position:fixed; bottom:0; left:0; right:0; height:80px; background:var(--card); border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; padding-bottom:20px; }
    .nav-item { color:var(--muted); font-size:10px; text-decoration:none; display:flex; flex-direction:column; align-items:center; gap:4px; }
    .nav-item.active { color:var(--accent); }
    .nav-icon { width:22px; height:22px; fill:currentColor; }
  </style>
</head>
<body>
  <div class="status-bar"><span>9:41</span><span>100%</span></div>
  <header><h1 style="font-size:20px; font-weight:800;">Priority Matrix</h1><p style="font-size:12px; color:var(--muted);">Eisenhower method</p></header>

  <div class="matrix">
    <div class="quad" style="border-color:rgba(239,68,68,0.3);">
      <div class="quad-head"><div class="q-dot" style="background:var(--red);"></div><span style="color:var(--red);">DO NOW</span></div>
      <div class="task-row"><div class="mini-check"></div>Lab Report 2</div>
      <div class="task-row"><div class="mini-check"></div>DM Assignment 3</div>
    </div>
    <div class="quad" style="border-color:rgba(245,158,11,0.3);">
      <div class="quad-head"><div class="q-dot" style="background:var(--amber);"></div><span style="color:var(--amber);">SCHEDULE</span></div>
      <div class="task-row"><div class="mini-check"></div>Mid-Sem Prep</div>
      <div class="task-row"><div class="mini-check"></div>AI Lab Viva</div>
    </div>
    <div class="quad" style="border-color:rgba(99,102,241,0.3);">
      <div class="quad-head"><div class="q-dot" style="background:var(--accent);"></div><span style="color:var(--accent);">DELEGATE</span></div>
      <div class="task-row"><div class="mini-check"></div>Group study session</div>
    </div>
    <div class="quad" style="opacity:0.5;">
      <div class="quad-head"><div class="q-dot" style="background:var(--muted);"></div><span>ELIMINATE</span></div>
      <div class="task-row"><div class="mini-check"></div>Optional extra reading</div>
    </div>
  </div>

  <div class="quick-add">
    <div style="font-size:18px; color:var(--muted);">+</div>
    <input class="qa-input" type="text" placeholder="Quick add task…">
    <button class="qa-btn"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
  </div>

  <nav class="nav-bar">
    <a href="../Dashboard/dashboard-v3.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</a>
    <a href="../Timetable/timetable-v3.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>Schedule</a>
    <a href="#" class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>Tasks</a>
    <a href="../Notes/notes-v3.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>Notes</a>
    <a href="../Settings/settings-v3.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>More</a>
  </nav>
</body>
</html>
