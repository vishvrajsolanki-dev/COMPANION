<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard v3 — Hybrid Widget Grid — Student Academic OS</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #6366f1;
      --accent-green: #10b981;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; }
    .status-bar { height: 47px; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }

    .header-bar { padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .user-pill { background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.3); padding: 4px 12px; border-radius: 20px; font-size: 12px; color: var(--accent); font-family: var(--font-mono); }

    .grid-container { padding: 16px 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .hero-full { grid-column: span 2; background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 18px; }
    .hero-title { font-size: 20px; font-weight: 700; margin: 6px 0; }

    .widget-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; height: 130px; }
    .ring-val { font-size: 28px; font-weight: 800; color: var(--accent-green); font-family: var(--font-mono); }

    .fab { position: fixed; bottom: 96px; right: 20px; width: 52px; height: 52px; background: var(--accent); border-radius: 50%; display: grid; place-items: center; box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4); border: none; cursor: pointer; }
    .fab svg { width: 24px; height: 24px; fill: #fff; }

    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: var(--card-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding-bottom: 20px; }
    .nav-item { color: var(--text-muted); font-size: 10px; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .nav-item.active { color: var(--accent); }
    .nav-icon { width: 22px; height: 22px; fill: currentColor; }
  </style>
</head>
<body>
  <div class="status-bar"><span>9:41</span><span>100%</span></div>

  <div class="header-bar">
    <div><h1 style="font-size: 20px; font-weight: 800;">Academic Dashboard</h1></div>
    <div class="user-pill">Sem 3 AI & DS</div>
  </div>

  <div class="grid-container">
    <div class="hero-full">
      <div style="font-size: 11px; font-family: var(--font-mono); color: var(--accent);">NEXT CLASS • 9:05 AM</div>
      <div class="hero-title">Data Structures & Algorithms</div>
      <div style="font-size: 13px; color: var(--text-muted);">Room 204 • Prof. Patel</div>
    </div>

    <div class="widget-box">
      <div style="font-size: 12px; color: var(--text-muted);">ATTENDANCE</div>
      <div class="ring-val">84.6%</div>
      <div style="font-size: 11px; color: var(--accent-green); font-family: var(--font-mono);">Safe: +2 Slots</div>
    </div>

    <div class="widget-box">
      <div style="font-size: 12px; color: var(--text-muted);">EXAM COUNTDOWN</div>
      <div class="ring-val" style="color: var(--accent);">14 Days</div>
      <div style="font-size: 11px; color: var(--text-muted); font-family: var(--font-mono);">Mid-Sem Exam</div>
    </div>
  </div>

  <button class="fab" onclick="window.location.href='../QuickCapture/capture-v1.html'"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>

  <nav class="nav-bar">
    <a href="#" class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</a>
    <a href="../Timetable/timetable-v3.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>Schedule</a>
    <a href="../Attendance/attendance-v3.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>Attendance</a>
    <a href="../Notes/notes-v3.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>Notes</a>
  </nav>
</body>
</html>
