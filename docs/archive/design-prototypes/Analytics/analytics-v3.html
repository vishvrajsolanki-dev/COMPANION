<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Analytics v3 — Heatmap Calendar — Student Academic OS</title>
  <style>
    :root { --bg:#090d16; --card:#111827; --border:rgba(255,255,255,0.08); --text:#f9fafb; --muted:#6b7280; --accent:#6366f1; --green:#10b981; --red:#ef4444; --mono:'JetBrains Mono',monospace; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,sans-serif; }
    body { background:var(--bg); color:var(--text); padding-bottom:90px; }
    .status-bar { height:47px; padding:0 24px; display:flex; justify-content:space-between; align-items:center; font-size:14px; }
    header { padding:12px 20px; border-bottom:1px solid var(--border); }

    /* Contribution-style heatmap */
    .heatmap-section { margin:16px 20px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; }
    .hm-title { font-size:13px; font-weight:700; margin-bottom:14px; }
    .hm-grid { display:grid; grid-template-columns:repeat(13,1fr); gap:3px; }
    .hm-cell { aspect-ratio:1; border-radius:3px; cursor:pointer; }
    .hm-0 { background:rgba(255,255,255,0.04); }
    .hm-1 { background:rgba(16,185,129,0.2); }
    .hm-2 { background:rgba(16,185,129,0.4); }
    .hm-3 { background:rgba(16,185,129,0.65); }
    .hm-4 { background:rgba(16,185,129,0.9); }
    .hm-miss { background:rgba(239,68,68,0.3); }
    .hm-legend { display:flex; align-items:center; gap:6px; margin-top:10px; font-size:10px; color:var(--muted); }
    .hm-leg-cell { width:12px; height:12px; border-radius:2px; }

    /* Semester timeline */
    .sem-bar { margin:0 20px 16px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; }
    .sb-head { font-size:13px; font-weight:700; margin-bottom:12px; }
    .sem-track { height:8px; background:rgba(255,255,255,0.06); border-radius:4px; overflow:hidden; margin-bottom:6px; position:relative; }
    .sem-fill { height:100%; background:linear-gradient(90deg, var(--green), var(--accent)); border-radius:4px; }
    .sem-meta { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); font-family:var(--mono); }

    /* Absence weekday analysis */
    .weekday-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; padding:0 20px 16px; }
    .wd-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 8px; text-align:center; }
    .wd-day { font-size:11px; font-family:var(--mono); color:var(--muted); margin-bottom:4px; }
    .wd-miss { font-size:20px; font-weight:800; }
    .wd-bar { height:3px; border-radius:2px; margin-top:6px; }

    .nav-bar { position:fixed; bottom:0; left:0; right:0; height:80px; background:var(--card); border-top:1px solid var(--border); display:flex; justify-content:space-around; align-items:center; padding-bottom:20px; }
    .nav-item { color:var(--muted); font-size:10px; text-decoration:none; display:flex; flex-direction:column; align-items:center; gap:4px; }
    .nav-item.active { color:var(--accent); }
    .nav-icon { width:22px; height:22px; fill:currentColor; }
  </style>
</head>
<body>
  <div class="status-bar"><span>9:41</span><span>100%</span></div>
  <header><h1 style="font-size:20px; font-weight:800;">Analytics</h1><p style="font-size:12px; color:var(--muted);">Academic Heatmap View</p></header>

  <div class="heatmap-section">
    <div class="hm-title">Attendance Activity — Last 13 Weeks</div>
    <div class="hm-grid">
      <!-- Row 1: Mon -->
      <div class="hm-cell hm-3"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-2"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-3"></div><div class="hm-cell hm-miss"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-2"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-3"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-1"></div><div class="hm-cell hm-4"></div>
      <!-- Row 2: Tue -->
      <div class="hm-cell hm-4"></div><div class="hm-cell hm-3"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-miss"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-2"></div><div class="hm-cell hm-3"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-miss"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-3"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-3"></div>
      <!-- Row 3: Wed -->
      <div class="hm-cell hm-2"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-3"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-miss"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-2"></div><div class="hm-cell hm-3"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-miss"></div><div class="hm-cell hm-2"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-3"></div>
      <!-- Row 4: Thu -->
      <div class="hm-cell hm-4"></div><div class="hm-cell hm-1"></div><div class="hm-cell hm-miss"></div><div class="hm-cell hm-3"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-3"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-miss"></div><div class="hm-cell hm-3"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-2"></div><div class="hm-cell hm-4"></div>
      <!-- Row 5: Fri -->
      <div class="hm-cell hm-3"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-2"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-miss"></div><div class="hm-cell hm-3"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-2"></div><div class="hm-cell hm-3"></div><div class="hm-cell hm-4"></div><div class="hm-cell hm-miss"></div><div class="hm-cell hm-4"></div>
    </div>
    <div class="hm-legend">
      <span>Less</span>
      <div class="hm-leg-cell hm-0"></div>
      <div class="hm-leg-cell hm-1"></div>
      <div class="hm-leg-cell hm-2"></div>
      <div class="hm-leg-cell hm-3"></div>
      <div class="hm-leg-cell hm-4"></div>
      <span>More</span>
      <div class="hm-leg-cell hm-miss"></div>
      <span>Absent</span>
    </div>
  </div>

  <div class="sem-bar">
    <div class="sb-head">Semester Progress — Week 8 of 18</div>
    <div class="sem-track"><div class="sem-fill" style="width: 44%;"></div></div>
    <div class="sem-meta"><span>Aug 1</span><span>44% complete</span><span>Dec 15</span></div>
  </div>

  <div style="padding:0 20px 8px; font-size:11px; font-family:var(--mono); text-transform:uppercase; color:var(--muted); letter-spacing:1px;">Absences by Day</div>
  <div class="weekday-grid">
    <div class="wd-card"><div class="wd-day">MON</div><div class="wd-miss" style="color:var(--muted);">1</div><div class="wd-bar" style="background:rgba(99,102,241,0.3);"></div></div>
    <div class="wd-card"><div class="wd-day">TUE</div><div class="wd-miss" style="color:var(--red);">3</div><div class="wd-bar" style="background:var(--red);"></div></div>
    <div class="wd-card"><div class="wd-day">WED</div><div class="wd-miss" style="color:var(--amber);">2</div><div class="wd-bar" style="background:var(--amber);"></div></div>
    <div class="wd-card"><div class="wd-day">THU</div><div class="wd-miss" style="color:var(--muted);">1</div><div class="wd-bar" style="background:rgba(99,102,241,0.3);"></div></div>
    <div class="wd-card"><div class="wd-day">FRI</div><div class="wd-miss" style="color:var(--amber);">2</div><div class="wd-bar" style="background:var(--amber);"></div></div>
  </div>

  <nav class="nav-bar">
    <a href="../Dashboard/dashboard-v3.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</a>
    <a href="../Timetable/timetable-v3.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>Schedule</a>
    <a href="#" class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58V19z"/></svg>Analytics</a>
    <a href="../Notes/notes-v3.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>Notes</a>
    <a href="../Settings/settings-v3.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>More</a>
  </nav>
</body>
</html>
